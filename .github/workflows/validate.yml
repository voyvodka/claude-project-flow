name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Deliberately unpinned: the gate asks "does this plugin load in the Claude Code
      # people actually have", so it has to track the current CLI rather than a frozen one.
      - name: Validate plugin manifest, skills and commands
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate plugins/project-flow --strict

      # SKILL.md routes to one reference per phase and the phases write from templates/.
      # A renamed file breaks a phase at the moment it is needed, and nothing else catches it.
      # A rename moved the plugin directory and the .gitignore rule was pinned to the old
      # path, so the private profile/local/ files landed in a commit. The rule is now
      # path-independent, and this asserts it stayed that way.
      - name: No private profile override may be tracked
        run: |
          tracked=$(git ls-files | grep 'profile/local/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::private profile overrides are tracked — they must never be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "ok: nothing under profile/local/ is tracked"

      - name: Skill routing and templates must resolve
        run: |
          cd plugins/project-flow/skills/project-flow
          fail=0
          for f in references/*.md templates/*.md profile/*.md; do
            base=$(basename "$f")
            # `|| true` on both stages: grep exits 1 when it matches nothing, which under
            # `set -eo pipefail` would kill the step at the exact moment it found the problem
            # it exists to report — an opaque abort instead of an annotated failure.
            hits=$( { grep -rl --include='*.md' -- "$base" . || true; } | { grep -v "^\./$f$" || true; } | wc -l | tr -d ' ')
            if [ "$hits" = "0" ]; then echo "::error::unreferenced, nothing routes to it: $f"; fail=1; fi
          done
          for p in $(grep -o 'references/[a-z0-9-]*\.md' SKILL.md | sort -u); do
            [ -f "$p" ] || { echo "::error::SKILL.md points at a missing reference: $p"; fail=1; }
          done
          for p in $(grep -rho 'templates/[a-zA-Z0-9._-]*\.md' references/*.md SKILL.md | sort -u); do
            [ -f "$p" ] || { echo "::error::a phase reference points at a missing template: $p"; fail=1; }
          done
          exit $fail

      # Two releases shipped a version block holding the same fixes twice, under two `### Fixed`
      # headings, because separate PRs each appended to `[Unreleased]` and the release stamped both
      # without merging them. Reading the file is what caught it, months later. A duplicated heading
      # is mechanically detectable, so it is checked rather than trusted.
      - name: Changelog structure
        run: |
          python3 - <<'PY'
          import re, sys

          lines = open('CHANGELOG.md').read().split('\n')
          errors, versions, cur, seen = [], [], None, set()
          ORDER = ['Added', 'Changed', 'Deprecated', 'Removed', 'Fixed', 'Security']

          for n, line in enumerate(lines, 1):
              if line.startswith('## '):
                  cur, seen = line[3:].strip(), set()
                  versions.append((n, cur))
              elif line.startswith('### '):
                  h = line[4:].strip()
                  if h in seen:
                      errors.append(f"line {n}: '{h}' appears twice under '{cur}' — "
                                    "merge the two blocks into one")
                  seen.add(h)
                  if h not in ORDER:
                      errors.append(f"line {n}: '{h}' is not a Keep a Changelog section "
                                    f"({', '.join(ORDER)})")

          names = [v for _, v in versions]
          if '[Unreleased]' not in names:
              errors.append("no '## [Unreleased]' section — the next change has nowhere to land, "
                            "which is how entries end up appended to an already-released block")

          released = [(n, v) for n, v in versions if v != '[Unreleased]']
          for n, v in released:
              if not re.match(r'^\[\d+\.\d+\.\d+\] - \d{4}-\d{2}-\d{2}$', v):
                  errors.append(f"line {n}: '{v}' is not '[x.y.z] - YYYY-MM-DD'")

          nums = [re.match(r'^\[([^\]]+)\]', v).group(1) for _, v in released]
          for d in sorted({n for n in nums if nums.count(n) > 1}):
              errors.append(f"version {d} has more than one heading — one version, one block")

          for e in errors:
              print(f"::error file=CHANGELOG.md::{e}")
          print(f"checked {len(versions)} version blocks: {'FAIL' if errors else 'ok'}")
          sys.exit(1 if errors else 0)
          PY
